[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-multiagent"
version = "0.1.0"
description = "Educational distributed multi-agent market simulation for a deep learning technologies project"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Project Author" }]
dependencies = []

[project.scripts]
distributed-multiagent = "distributed_multiagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
